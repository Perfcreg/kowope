spring:
  application:
    name: memo-balance
  datasource:
    url: jdbc:postgresql://localhost:5432/mbp
    username: mbp
    password: mbp
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    # Producer/consumer factories are wired explicitly in config/KafkaConfig.java,
    # not via spring.kafka.consumer/producer autoconfiguration — this is the one
    # property that config still reads directly.
    bootstrap-servers: localhost:9092
server:
  port: 8088

security:
  jwt:
    # Dev-only symmetric key so this service is a working, testable resource
    # server before shared-platform's authentication-service exists (ticket 03).
    # Replace with issuer-uri/jwk-set-uri once that context is real.
    dev-secret: "dev-only-secret-replace-once-shared-platform-issues-real-tokens"
