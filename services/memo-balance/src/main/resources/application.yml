spring:
  application:
    name: memo-balance
  servlet:
    multipart:
      # System-wide-audit fix (2026-09-15): document upload had no size limit
      # at all — an unbounded MultipartFile read straight to disk is a real
      # resource-exhaustion risk, not something RFP §3.11's "no format
      # restriction" ask required. Matches excel-import-service's own limit.
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 10MB
  datasource:
    url: jdbc:postgresql://localhost:5432/mbp
    username: mbp
    password: mbp
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    # Producer/consumer factories are wired explicitly in config/KafkaConfig.java,
    # not via spring.kafka.consumer/producer autoconfiguration — this is the one
    # property that config still reads directly.
    bootstrap-servers: localhost:9092
server:
  port: 8088

memo-balance:
  document-storage:
    # Ticket 07: local filesystem stand-in for real Blob storage (ADR-0003) —
    # swap DocumentStorage's implementation, not this property, once provisioned.
    base-dir: "./data/memo-balance/documents"

security:
  jwt:
    # ADR-0017: shared-platform's authentication-service now issues real
    # RS256 tokens, verified here via its JWKS endpoint (no shared secret).
    jwk-set-uri: http://localhost:8085/.well-known/jwks.json
