spring:
  application:
    name: vision-etl-connector

# No server.port: this adapter has no REST endpoint (no spring-boot-starter-web
# on the classpath), so no web server starts.

# ADR-0013: mfb-stack's own committed dev-only Fineract credentials, not a
# secret this project introduces. Real Vision would replace this block.
fineract:
  base-url: http://localhost:8444
  tenant: default
  username: mifos
  password: password
  client-page-size: 200

kafka:
  bootstrap-servers: localhost:9092

vision-balance-synced:
  topic: mbp.integration.vision-balance-synced

vision:
  sync:
    interval-ms: 60000

# ADR-0019: shared-platform's notification-service, now real — HttpNotificationClient
# replaces the old LoggingNotificationClient stand-in.
notification:
  service:
    base-url: http://localhost:8086

camel:
  springboot:
    main-run-controller: true
