spring:
  application:
    name: excel-import-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      # Keeps every upload up to the size cap in memory instead of spilling
      # to a cleartext temp file on disk (RFP §4.3 at-rest encryption) — the
      # threshold must be >= max-file-size for this to actually hold.
      file-size-threshold: 10MB

server:
  port: 8083

# ADR pending shared-platform: dev-only symmetric secret, same interim seam as
# memo-balance's SecurityConfig.
security:
  jwt:
    dev-secret: "dev-only-secret-replace-once-shared-platform-issues-real-tokens"

kafka:
  bootstrap-servers: localhost:9092

memo-detected:
  topic: mbp.integration.memo-detected

excel-import:
  publish:
    max-redeliveries: 3
    redelivery-delay-ms: 2000
    backoff-multiplier: 2.0

camel:
  springboot:
    main-run-controller: true
