spring:
  application:
    name: excel-import-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      # Keeps every upload up to the size cap in memory instead of spilling
      # to a cleartext temp file on disk (RFP §4.3 at-rest encryption) — the
      # threshold must be >= max-file-size for this to actually hold.
      file-size-threshold: 10MB

server:
  port: 8083

# ADR-0017: shared-platform's authentication-service now issues real RS256
# tokens, verified here via its JWKS endpoint (no shared secret).
security:
  jwt:
    jwk-set-uri: http://localhost:8085/.well-known/jwks.json

kafka:
  bootstrap-servers: localhost:9092

memo-detected:
  topic: mbp.integration.memo-detected

excel-import:
  publish:
    max-redeliveries: 3
    redelivery-delay-ms: 2000
    backoff-multiplier: 2.0

camel:
  springboot:
    main-run-controller: true
