spring:
  application:
    name: excel-import-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8083

# ADR pending shared-platform: dev-only symmetric secret, same interim seam as
# memo-balance's SecurityConfig.
security:
  jwt:
    dev-secret: "dev-only-secret-replace-once-shared-platform-issues-real-tokens"

kafka:
  bootstrap-servers: localhost:9092

memo-detected:
  topic: mbp.integration.memo-detected

camel:
  springboot:
    main-run-controller: true
