spring:
  application:
    name: icad-integration-adapter

server:
  # Was 8085 (chosen speculatively before merge, assuming that port was free);
  # authentication-service already owns 8085 for real, so this collided once
  # both services needed to run simultaneously (shared-platform Ticket 01).
  port: 8093

# ADR-0014: no real NIBSS ICAD sandbox is reachable from this project — every
# environment this points at (including local dev) is a WireMock stub of the
# pushAccount/fetchAccount contract modeled in IcadClient.
icad:
  base-url: http://localhost:9999
  api-key: dev-only-placeholder
  poll:
    interval-ms: 30000

# ADR-0017: shared-platform's authentication-service now issues real RS256
# tokens, verified here via its JWKS endpoint (no shared secret).
security:
  jwt:
    jwk-set-uri: http://localhost:8085/.well-known/jwks.json

kafka:
  bootstrap-servers: localhost:9092

icad-clearance-outcome:
  topic: mbp.integration.icad-clearance-outcome

# ADR-0019: shared-platform's notification-service, now real — HttpNotificationClient
# replaces the old LoggingNotificationClient stand-in.
notification:
  service:
    base-url: http://localhost:8086

camel:
  springboot:
    main-run-controller: true
